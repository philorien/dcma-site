# The Sanity Studio (studio/) is intentionally NOT a pnpm workspace member.
# Its build toolchain doesn't cooperate with pnpm's symlinked node_modules,
# so studio/ is managed with npm (see studio/package-lock.json). Root = pnpm.
packages: []

allowBuilds:
  '@parcel/watcher': false
  esbuild: false

overrides:
  react: 19.2.8
  react-dom: 19.2.8
