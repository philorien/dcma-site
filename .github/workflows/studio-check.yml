name: Studio check

# Validates the Sanity schema on PRs that touch studio/. Needs no secrets, so it
# also runs on PRs from forks.

on:
  pull_request:
    branches: [main]
    paths:
      - 'studio/**'
      - '.github/workflows/studio-check.yml'

permissions:
  contents: read

jobs:
  schema:
    name: Validate schema
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: studio

    steps:
      - uses: actions/checkout@v4

      # The Sanity CLI's resolver follows the repo-root tsconfig.json, whose
      # references point at .nuxt/tsconfig.*.json. Those files are gitignored and
      # generated by `nuxt prepare` (the root postinstall), so install the app
      # first or validate/build fails with "Tsconfig not found".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install app dependencies (generates .nuxt tsconfigs)
        working-directory: .
        run: pnpm install --frozen-lockfile

      # studio/ is managed with npm, separately from the pnpm workspace
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('studio/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install Studio dependencies
        run: npm ci

      - name: Validate schema
        run: npx sanity schemas validate --level error
